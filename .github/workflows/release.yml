# Builds the Windows and Mac installers and attaches them to a draft GitHub release.
# Run it by pushing a version tag: git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v1.*'] # 2.x tags build the native app (release-native.yml)

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag must match the app version
        shell: bash
        run: test "v$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match the app version in tauri.conf.json"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Lectern ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your system below. The installers are not code-signed, so Windows and macOS will warn the first time you open them.'
          releaseDraft: true
          args: ${{ matrix.args }}

  # The repo is private, so the app reads latest.json from the 'updates' branch with a token and downloads installers by API url.
  # When the repo goes public this job can go: tauri-action's own latest.json works as is.
  updates:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/latest-json.js ${{ github.ref_name }} > $RUNNER_TEMP/latest.json
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git switch --orphan updates
          cp $RUNNER_TEMP/latest.json latest.json
          git add latest.json
          git commit -m 'Update info for ${{ github.ref_name }}'
          git push --force origin updates
