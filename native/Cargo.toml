[package]
name = "lectern-native"
version = "2.0.0"
edition = "2024"
description = "Audiobookshelf player"

# lectern.exe, like the Tauri app, so an installed 1.x is updated in place
[[bin]]
name = "lectern"
path = "src/main.rs"

# installers built by cargo-packager (in the release workflow): NSIS on Windows, an app bundle and a dmg on a Mac. The product name
# and identifier match the Tauri app's, so they install over it.
[package.metadata.packager]
product-name = "Lectern"
identifier = "app.lectern.desktop"
publisher = "Lectern"
before-packaging-command = "cargo build --release"
binaries-dir = "target/release"
out-dir = "dist"
binaries = [{ path = "lectern", main = true }]
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]

[dependencies]
cargo-packager-updater = "0.2.3"
chrono = "0.4.45"
dirs = "7.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
png = "0.18"
raw-window-handle = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.18"
rodio = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# the software renderer: about 9 MB private memory against about 128 MB for the OpenGL one, and plenty fast for this UI
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "system-tray", "raw-window-handle-06"] }
souvlaki = "0.9"

[build-dependencies]
slint-build = "1.19"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
