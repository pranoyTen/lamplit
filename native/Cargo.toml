[package]
name = "lamplit"
version = "2.1.0"
edition = "2024"
description = "Audiobookshelf player"
license = "GPL-3.0-only"

[[bin]]
name = "lamplit"
path = "src/main.rs"

# installers built by cargo-packager (in the release workflow): NSIS on Windows, an app bundle and a dmg on a Mac.
[package.metadata.packager]
product-name = "Lamplit"
identifier = "app.lamplit.desktop"
publisher = "Lamplit"
before-packaging-command = "cargo build --release"
binaries-dir = "target/release"
out-dir = "dist"
binaries = [{ path = "lamplit", main = true }]
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]

# the app was called Lectern up to 2.0.3: its own uninstaller removes that copy (never settings or downloads). Another project's app is
# also called Lectern, so this only runs for the one our installer registered.
[package.metadata.packager.nsis]
preinstall-section = '''
Section "RemoveLectern"
  ReadRegStr $0 HKCU "Software\Lectern\Lectern" ""
  ReadRegStr $1 HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Lectern" "Publisher"
  ${If} $0 != ""
  ${AndIf} $1 == "Lectern"
  ${AndIf} ${FileExists} "$0\uninstall.exe"
    ExecWait '"$0\uninstall.exe" /S _?=$0'
    Delete "$0\uninstall.exe"
    RMDir "$0"
  ${EndIf}
SectionEnd
'''

[dependencies]
cargo-packager-updater = "0.2.3"
chrono = "0.4.45"
dirs = "7.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
png = "0.18"
raw-window-handle = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.18"
rodio = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# the software renderer: about 9 MB private memory against about 128 MB for the OpenGL one, and plenty fast for this UI
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "system-tray", "raw-window-handle-06"] }
souvlaki = "0.9"

[build-dependencies]
slint-build = "1.19"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Networking_Connectivity", "Foundation", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSColor", "NSEvent", "NSGraphics", "NSResponder", "NSScreen", "NSView", "NSVisualEffectView", "NSWindow", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
tray-icon = { version = "0.25", default-features = false }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

# softbuffer 0.4.8 with one line changed (src/backends/cg.rs), so a window can be see-through on a Mac. Drop it once upstream can do that.
[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }
